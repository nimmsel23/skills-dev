# Live-Deploy: jeder Push auf dev → ${{ steps.firebase_deploy.outputs.details_url }}
# (Hosting-Ziel "skills" im Projekt fitness-aos, siehe .firebaserc).
#
# (Liegt seit 2026-10-15 unter .github/workflows/, vorher inaktiv in ci/.)
# Ohne Secret wird nur gebaut, der Deploy übersprungen.
#
# Läuft in GitHub statt lokal, damit auch Pushes aus Cloud-Sessions ohne
# Firebase-CLI deployen. Der lokale .githooks/pre-push prüft nur den Build.
#
# Benötigte Repo-Secrets:
#   FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS (oder FIREBASE_SERVICE_ACCOUNT)
#   TELEGRAM_TO + TELEGRAM_TOKEN (optional, für die Benachrichtigung)

#
# PREVIEW statt Live (Regel 2026-10-16): echte Prod-URLs (vos-*.web.app) werden nur noch
# aus dem Branch `vitalos` der Meta-Repo-Checkouts (~/vitalos/*-app) deployt. Dieser
# Workflow veröffentlicht auf dem Branch `dev` ausschließlich einen 24h-Preview-Channel `dev`.

name: Preview (vos-skills)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.githooks/**'

concurrency:
  group: deploy-vos-skills
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # Version aus package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --ignore-scripts   # kein Lockfile im Repo

      - name: "Build (Stempel = Splash + Service Worker)"
        run: pnpm run build

      - name: Hinweis - Secret fehlt
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS fehlt - Deploy übersprungen."

      - name: Preview-Channel dev (24h)
        if: env.FIREBASE_SA != ''
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          target: skills
          channelId: dev
          expires: 24h

      - name: Telegram-Benachrichtigung
        if: success() && env.FIREBASE_SA != '' && env.TELEGRAM_TO != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔍 Skills-Preview (24h) deployed!

            🔗 ${{ steps.firebase_deploy.outputs.details_url }}

            Commit: ${{ github.event.head_commit.message }}
