# Standalone-Prod Skills: Push auf master deployt live (nur CI) — aus dem MASTER-Checkout des eigenen Repos,
# OHNE das Meta-Repo vitalos (gleiches Muster wie fitness-dev/deploy-master.yml). Skills hat keine Nachbar-Repos
# und keine Submodule; Install mit eigenem Lockfile (standalone, ohne Workspace).
# Auslöser: push auf master und workflow_dispatch (automerge.yml) -> baut und deployt live (nur master).
# Push auf `ci-test/**` -> reiner Build-Test, KEIN Deploy.
# Shell-Pin im Meta-Repo bleibt bewusst: Pointer-Bump via vos-release/vos-ship, kein Auto-Push auf einen vitalos-Branch.

name: Live Deploy (Skills master)

'on':
  workflow_dispatch:
    inputs:
      deploy:
        description: "Live deployen? (nur auf master wirksam; false = nur bauen)"
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'ci-test/**'

concurrency:
  group: live-skills-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      # Gate: live nur, wenn Check (Skills) fuer GENAU diesen SHA gruen ist (auch bei direktem Push auf master,
      # z. B. vos-ship). So geht ein roter Stand nie live, egal wie er auf master gelandet ist.
      - name: Gate - Check (Skills) gruen fuer diesen SHA
        if: env.DO_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          res=$(gh api "repos/$REPO/actions/workflows/check.yml/runs?head_sha=$SHA&per_page=20" \
            --jq '[.workflow_runs[]|select(.head_sha==env.SHA)]|sort_by(.run_number)|last|if .==null then "none" elif .status!="completed" then "pending" else (.conclusion // "none") end')
          echo "Check (Skills) fuer $SHA: $res"
          if [ "$res" != "success" ]; then
            echo "::error::Check (Skills) fuer $SHA ist '$res' -> kein Live-Deploy. Erst auf dev gruen machen; Auto-Promote zieht dann nach."
            exit 1
          fi

      - name: Checkout skills-dev
        uses: actions/checkout@v4
        with:
          path: skills-dev
          # Volle Historie: der Changelog liest bei workflow_dispatch `git log <parent>..HEAD`.
          fetch-depth: 0

      - name: Checkout shared 6Pack source
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/6pack-dev
          ref: master
          path: skills-dev/.sixpack-dependency
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: skills-dev/pnpm-lock.yaml

      - name: Install Skills standalone dependencies
        working-directory: skills-dev
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify exercise videos
        working-directory: skills-dev
        run: node scripts/test-exercise-videos.mjs

      - name: Install shared 6Pack dependencies
        run: pnpm --dir skills-dev/.sixpack-dependency install --ignore-scripts --frozen-lockfile

      # sixpackData.generated.js ist in 6pack-dev gitignored und wird dort per prebuild erzeugt;
      # --ignore-scripts ueberspringt das -> Generator explizit laufen lassen (sonst: Could not resolve).
      - name: Generate shared 6Pack data
        run: pnpm --dir skills-dev/.sixpack-dependency run build:data

      - name: Build Skills
        working-directory: skills-dev
        run: pnpm run build

      - name: Deploy Skills to Firebase Hosting
        if: env.DO_DEPLOY == 'true'
        working-directory: skills-dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/skills-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/skills-sa.json" \
            npx firebase-tools@latest deploy --only hosting:skills \
            --project fitness-aos --non-interactive


